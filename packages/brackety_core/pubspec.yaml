name: brackety_core
description: Shared code for the Brackety app and admin (config, network, layout, theme).
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  intl: 0.20.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/fonts/OFL-ZenKakuGothicNew.txt
    - assets/fonts/OFL-SairaCondensed.txt
  fonts:
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    - family: SairaCondensed
      fonts:
        - asset: assets/fonts/SairaCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SairaCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/SairaCondensed-ExtraBold.ttf
          weight: 800
