name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  # PRs to development only test the components they touch (docs/producto/calidad.md).
  # Releases (PRs to main) and pushes run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.pick.outputs.server }}
      server-tests: ${{ steps.pick.outputs.server-tests }}
      flutter: ${{ steps.pick.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" != main ]; then
            files=$(git diff --name-only "$BASE_SHA"...HEAD)
          else
            files=everything
          fi
          echo "$files"
          touched() { [ "$files" = everything ] || echo "$files" | grep -qE "$1"; }
          # A change to this workflow tests everything it runs.
          all='^\.github/workflows/ci\.yml$'
          server=false
          # spec/ holds cases both the server and the app pass.
          touched "^(server|spec)/|$all" && server=true
          flutter=()
          touched "^packages/|$all" && flutter+=('"packages/brackety_core"')
          touched "^(app|packages|spec)/|$all" && flutter+=('"app"')
          touched "^(admin|packages)/|$all" && flutter+=('"admin"')
          echo "server=$server" >> "$GITHUB_OUTPUT"
          # Empty: every server test. Else only those of the touched modules (tools/server_tests.py).
          if [ "$files" != everything ]; then
            echo "server-tests=$(echo "$files" | python3 tools/server_tests.py)" >> "$GITHUB_OUTPUT"
          fi
          echo "flutter=[$(IFS=,; echo "${flutter[*]}")]" >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, format check and tests
        # A pull request to development tests the modules it touches; a release runs every test, and the
        # whole day of the server battery with five seeds per sport (docs/04-testing.md).
        env:
          TESTS: ${{ needs.changes.outputs.server-tests }}
          SEEDS: ${{ github.base_ref == 'main' && '-Dbattery.seeds=5' || '' }}
        run: |
          if [ -n "$TESTS" ]; then
            echo "Tests: $TESTS"
            ./mvnw -B verify "-Dtest=$TESTS" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -B verify $SEEDS
          fi

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.flutter) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docs stay at 150 lines or less
        run: |
          long=$(find docs -name '*.md' -exec awk 'END { if (NR > 150) print FILENAME " (" NR " lines)" }' {} \;)
          if [ -n "$long" ]; then echo "Split these docs (rule in .claude/rules/docs-upkeep.md):"; echo "$long"; exit 1; fi

  # Size and structure limits that only go down (tools/code_metrics.py, docs/producto/plan-limpieza.md).
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Code metrics stay within their limits
        run: |
          set -o pipefail
          python3 tools/code_metrics.py --check | tee -a "$GITHUB_STEP_SUMMARY"

  # The one check branch protection asks for: skipped jobs count as passed, failed or cancelled ones do not.
  ci-ok:
    if: always()
    needs: [changes, server, flutter, docs, metrics]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
