spring.application.name=brackety

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

brackety.time-zone=Europe/Madrid
brackety.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

spring.mvc.problemdetails.enabled=true
# Participant import (docs/modulos/importacion-alumnos.md): up to 10 files of 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=105MB
# Behind the proxy (cloudflared/nginx on the private network) the client IP comes from X-Forwarded-For;
# login lockout per IP depends on it. Tomcat trusts it from private IPs only; on the Pi the API is reached only
# from the host and its Docker network. Without a proxy (sports hall laptop) start-event.ps1 sets it to none.
server.forward-headers-strategy=native

# Requests per IP and minute. Generous because everyone at an event shares one public IP;
# Cloudflare is the finer, first barrier.
brackety.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:3000}
brackety.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
brackety.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:600}

# Unverified accounts: reminder on day 5, deleted on day 7. Runs daily and this long after startup.
brackety.auth.unverified-purge-initial-delay=PT1M
# Deleted accounts: purged for good 30 days after deletion. Runs daily and this long after startup.
brackety.auth.deleted-purge-initial-delay=PT1M

# Life of an access token. 12h on the sports hall laptop (start-event.ps1): phones without signal keep working.
brackety.auth.access-ttl=${ACCESS_TTL:15m}

# Web refresh cookie with the Secure flag. Only start-event.ps1 turns it off: the sports hall laptop serves
# plain http on 192.168.137.1, where a Secure cookie is never sent back and a page reload would lose the session.
brackety.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

# HMAC key for access tokens, at least 32 bytes.
brackety.auth.jwt-secret=${JWT_SECRET}

# Google OAuth client IDs allowed as audience of the ID token (web and Android), comma separated.
# Empty: /api/v1/auth/google answers 503 and the rest of the API works as usual.
brackety.auth.google-client-ids=${GOOGLE_CLIENT_ID:}

# Superadmin (one per environment). Empty: POST /api/v1/admin/auth/login answers 503.
# The hash is Argon2id, made with the same encoder as user passwords (docs/09-despliegue.md).
brackety.superadmin.email=${SUPERADMIN_EMAIL:}
brackety.superadmin.password-hash=${SUPERADMIN_PASSWORD_HASH:}
# Cloudflare Access in front of the superadmin API: team domain (e.g. myteam.cloudflareaccess.com) and the
# Application Audience (AUD) tag. Either empty: every /api/v1/admin/** request answers 503.
brackety.admin.cloudflare-access.team-domain=${CF_ACCESS_TEAM_DOMAIN:}
brackety.admin.cloudflare-access.audience=${CF_ACCESS_AUD:}
# Hall laptop only (no Cloudflare there): the superadmin API answers requests from the laptop itself (loopback)
# without Access, and refuses every other address. Never in the Pi or any server reachable from outside.
brackety.admin.local-only=${ADMIN_LOCAL_ONLY:false}

# Emails: with RESEND_API_KEY empty they are only written to the log (local, tests).
brackety.email.resend-api-key=${RESEND_API_KEY:}
brackety.email.from=${EMAIL_FROM:}
# Public web URL, used to build the links in emails.
brackety.public-base-url=${PUBLIC_BASE_URL:}
# On restart, wait for emails already queued on the task executor instead of dropping them.
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s
spring.messages.basename=i18n/messages
spring.messages.fallback-to-system-locale=false

# Liga Yoseikan phase 1 prototype: creates the demo accounts (password = username) and event.
brackety.demo.enabled=${DEMO_ACCOUNTS_ENABLED:false}
# Event date for the age categories; empty = the day the accounts are created.
brackety.demo.event-date=${DEMO_EVENT_DATE:}

# Legal pages (docs/modulos/legal-paginas.md): owner and privacy contact shown in the texts. Without the email
# the API refuses to publish events and to advance phases.
brackety.legal.owner-name=${LEGAL_OWNER_NAME:}
brackety.legal.privacy-contact-email=${PRIVACY_CONTACT_EMAIL:}

# Folder with the Flutter web build, served by the API itself on the sports hall laptop (same origin, see
# docs/modulos/servidor-local.md). Empty, as in Docker where nginx serves the web: the API serves no web.
brackety.web-dir=${WEB_DIR:}
# The admin web build, served at /admin/ (hall laptop). Empty: not served.
brackety.admin-web-dir=${ADMIN_WEB_DIR:}

# Event package (.brackety file) to load at startup into an empty database, on the sports hall laptop
# (docs/modulos/servidor-local.md). Startup fails if the database already has an event or the file is invalid.
brackety.package=${BRACKETY_PACKAGE:}
# File where the load writes the staff accounts it creates with their random passwords (required with a package).
brackety.package-credentials=${BRACKETY_PACKAGE_CREDENTIALS:}
