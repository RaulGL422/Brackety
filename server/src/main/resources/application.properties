spring.application.name=brackety

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

brackety.time-zone=Europe/Madrid
brackety.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

spring.mvc.problemdetails.enabled=true
# Behind the proxy (cloudflared/nginx on the private network) the client IP comes from X-Forwarded-For;
# login lockout per IP depends on it.
server.forward-headers-strategy=native

# Requests per IP and minute. Generous because everyone at an event shares one public IP;
# Cloudflare is the finer, first barrier.
brackety.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:3000}
brackety.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
brackety.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:600}

# Unverified accounts: reminder on day 5, deleted on day 7. Runs daily and this long after startup.
brackety.auth.unverified-purge-initial-delay=PT1M
# Deleted accounts: purged for good 30 days after deletion. Runs daily and this long after startup.
brackety.auth.deleted-purge-initial-delay=PT1M

# HMAC key for access tokens, at least 32 bytes.
brackety.auth.jwt-secret=${JWT_SECRET}

# Google OAuth client IDs allowed as audience of the ID token (web and Android), comma separated.
# Empty: /api/v1/auth/google answers 503 and the rest of the API works as usual.
brackety.auth.google-client-ids=${GOOGLE_CLIENT_ID:}

# Emails: with RESEND_API_KEY empty they are only written to the log (local, tests).
brackety.email.resend-api-key=${RESEND_API_KEY:}
brackety.email.from=${EMAIL_FROM:}
# Public web URL, used to build the links in emails.
brackety.public-base-url=${PUBLIC_BASE_URL:}
# On restart, wait for emails already queued on the task executor instead of dropping them.
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s
spring.messages.basename=i18n/messages
spring.messages.fallback-to-system-locale=false
