spring.application.name=brackety

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

brackety.time-zone=Europe/Madrid
brackety.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

spring.mvc.problemdetails.enabled=true
# Behind the proxy (cloudflared/nginx on the private network) the client IP comes from X-Forwarded-For;
# login lockout per IP depends on it.
server.forward-headers-strategy=native

# Requests per IP and minute. Generous because everyone at an event shares one public IP;
# Cloudflare is the finer, first barrier.
brackety.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:3000}
brackety.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
brackety.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:600}

# HMAC key for access tokens, at least 32 bytes.
brackety.auth.jwt-secret=${JWT_SECRET}
