# Spanish is the default; messages_en.properties has the English texts. No apostrophes: MessageFormat eats them.
email.footer=Brackety · Este es un mensaje automático, no respondas a este email.

email.verify.subject=Confirma tu email en Brackety
email.verify.body=Para terminar de crear tu cuenta en Brackety, confirma tu email. El enlace caduca en 24 horas. Si no has sido tú, ignora este mensaje.
email.verify.action=Confirmar email

email.reminder.subject=Tu cuenta de Brackety se borrará en 2 días
email.reminder.body=Aún no has confirmado tu email. Si no lo confirmas, en 2 días se borrará tu cuenta con todos sus datos. El enlace caduca en 24 horas.
email.reminder.action=Confirmar email

email.already-registered.subject=Ya tienes una cuenta en Brackety
email.already-registered.body=Alguien, quizá tú, ha intentado registrarse con este email, pero ya tiene una cuenta. Si no recuerdas tu contraseña, puedes cambiarla. Si no has sido tú, ignora este mensaje.
email.already-registered.action=Recuperar contraseña

email.reset.subject=Cambia tu contraseña de Brackety
email.reset.body=Has pedido cambiar tu contraseña. El enlace caduca en 1 hora. Si no has sido tú, ignora este mensaje: tu contraseña no cambia.
email.reset.action=Cambiar contraseña

email.password-changed.subject=Tu contraseña de Brackety ha cambiado
email.password-changed.body=Se ha cambiado la contraseña de tu cuenta y se han cerrado todas sus sesiones. Si no has sido tú, recupera tu cuenta ahora.
email.password-changed.action=Recuperar contraseña

email.session-reused.subject=Posible acceso no autorizado a tu cuenta de Brackety
email.session-reused.body=Se ha usado una sesión antigua de tu cuenta, lo que puede indicar que alguien la ha copiado. La hemos cerrado por seguridad. Te recomendamos cambiar tu contraseña.
email.session-reused.action=Cambiar contraseña

email.locked.subject=Tu cuenta de Brackety se ha bloqueado 15 minutos
email.locked.body=Ha habido varios intentos fallidos de entrar en tu cuenta y la hemos bloqueado 15 minutos. Si no has sido tú, cambia tu contraseña. Si necesitas ayuda, indica el código de bloqueo {0}.
email.locked.action=Cambiar contraseña
