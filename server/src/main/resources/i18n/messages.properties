# Spanish is the default; messages_en.properties has the English texts. No apostrophes: MessageFormat eats them.
email.footer=Brackety · Este es un mensaje automático, no respondas a este email.

email.verify.subject=Confirma tu email en Brackety
email.verify.body=Para terminar de crear tu cuenta en Brackety, confirma tu email. El enlace caduca en 24 horas. Si no has sido tú, ignora este mensaje.
email.verify.action=Confirmar email

email.reminder.subject=Tu cuenta de Brackety se borrará en 2 días
email.reminder.body=Aún no has confirmado tu email. Si no lo confirmas, en 2 días se borrará tu cuenta con todos sus datos. El enlace caduca en 24 horas.
email.reminder.action=Confirmar email

email.already-registered.subject=Ya tienes una cuenta en Brackety
email.already-registered.body=Alguien, quizá tú, ha intentado registrarse con este email, pero ya tiene una cuenta. Si no recuerdas tu contraseña, puedes cambiarla. Si no has sido tú, ignora este mensaje.
email.already-registered.action=Recuperar contraseña

email.reset.subject=Cambia tu contraseña de Brackety
email.reset.body=Has pedido cambiar tu contraseña. El enlace caduca en 1 hora. Si no has sido tú, ignora este mensaje: tu contraseña no cambia.
email.reset.action=Cambiar contraseña

email.password-changed.subject=Tu contraseña de Brackety ha cambiado
email.password-changed.body=Se ha cambiado la contraseña de tu cuenta y se han cerrado todas sus sesiones. Si no has sido tú, recupera tu cuenta ahora.
email.password-changed.action=Recuperar contraseña

email.session-reused.subject=Posible acceso no autorizado a tu cuenta de Brackety
email.session-reused.body=Se ha usado una sesión antigua de tu cuenta, lo que puede indicar que alguien la ha copiado. La hemos cerrado por seguridad. Te recomendamos cambiar tu contraseña.
email.session-reused.action=Cambiar contraseña

email.locked.subject=Tu cuenta de Brackety se ha bloqueado 15 minutos
email.locked.body=Ha habido varios intentos fallidos de entrar en tu cuenta y la hemos bloqueado 15 minutos. Si no has sido tú, cambia tu contraseña. Si necesitas ayuda, indica el código de bloqueo {0}.
email.locked.action=Cambiar contraseña

email.identity-linked.subject=Has vinculado una cuenta de {0} a Brackety
email.identity-linked.body=Se ha vinculado una cuenta de {0} a tu cuenta de Brackety y ya puedes entrar con ella. Si no has sido tú, cambia tu contraseña y desvincúlala desde ajustes.
email.identity-linked.action=Cambiar contraseña

email.identity-unlinked.subject=Has desvinculado tu cuenta de {0} de Brackety
email.identity-unlinked.body=Se ha desvinculado la cuenta de {0} de tu cuenta de Brackety y ya no puedes entrar con ella. Si no has sido tú, cambia tu contraseña ahora.
email.identity-unlinked.action=Cambiar contraseña

email.password-removed.subject=Se ha quitado la contraseña de tu cuenta de Brackety
email.password-removed.body=Se ha quitado la contraseña de tu cuenta y se han cerrado todas sus sesiones. Ahora solo puedes entrar con tus cuentas vinculadas. Si no has sido tú, recupera tu cuenta ahora.
email.password-removed.action=Recuperar contraseña

email.change-email.subject=Confirma tu nuevo email en Brackety
email.change-email.body=Has pedido usar esta dirección en tu cuenta de Brackety. Confírmala para terminar el cambio. El enlace caduca en 24 horas. Si no has sido tú, ignora este mensaje.
email.change-email.action=Confirmar email

email.email-in-use.subject=Alguien ha intentado usar tu email en Brackety
email.email-in-use.body=Alguien, quizá tú, ha intentado cambiar el email de una cuenta de Brackety a esta dirección, pero ya hay una cuenta con este email. No ha cambiado nada. Si no has sido tú, ignora este mensaje.
email.email-in-use.action=Recuperar contraseña

email.email-changed.subject=El email de tu cuenta de Brackety ha cambiado
email.email-changed.body=El email de tu cuenta se ha cambiado a {0} y se han cerrado todas sus sesiones. Esta dirección ya no sirve para entrar. Si no has sido tú, alguien conoce tu contraseña: si tienes Google vinculado, entra con él y vuelve a cambiar el email.
email.email-changed.action=Iniciar sesión

email.deletion-scheduled.subject=Tu cuenta de Brackety se va a borrar
email.deletion-scheduled.body=Tu cuenta se borrará definitivamente el {0}, con todos sus datos. Para cancelarlo, inicia sesión antes de ese día.
email.deletion-scheduled.action=Iniciar sesión

email.pending-deletion.subject=Tu cuenta de Brackety está pendiente de borrado
email.pending-deletion.body=Alguien, quizá tú, ha intentado registrarse con este email, pero su cuenta está pendiente de borrado. Para cancelar el borrado y seguir usándola, inicia sesión. Si no has sido tú, ignora este mensaje.
email.pending-deletion.action=Iniciar sesión
