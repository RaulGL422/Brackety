email.footer=Brackety · This is an automatic message, please do not reply.

email.verify.subject=Confirm your email on Brackety
email.verify.body=To finish creating your Brackety account, confirm your email. The link expires in 24 hours. If this was not you, ignore this message.
email.verify.action=Confirm email

email.reminder.subject=Your Brackety account will be deleted in 2 days
email.reminder.body=You have not confirmed your email yet. If you do not, your account and all its data will be deleted in 2 days. The link expires in 24 hours.
email.reminder.action=Confirm email

email.already-registered.subject=You already have a Brackety account
email.already-registered.body=Someone, maybe you, tried to sign up with this email, but it already has an account. If you do not remember your password, you can change it. If this was not you, ignore this message.
email.already-registered.action=Recover password

email.reset.subject=Change your Brackety password
email.reset.body=You asked to change your password. The link expires in 1 hour. If this was not you, ignore this message: your password stays the same.
email.reset.action=Change password

email.password-changed.subject=Your Brackety password has changed
email.password-changed.body=The password of your account has been changed and all its sessions have been closed. If this was not you, recover your account now.
email.password-changed.action=Recover password

email.session-reused.subject=Possible unauthorised access to your Brackety account
email.session-reused.body=An old session of your account was used, which may mean someone copied it. We have closed it to be safe. We recommend changing your password.
email.session-reused.action=Change password

email.locked.subject=Your Brackety account is locked for 15 minutes
email.locked.body=There were several failed attempts to sign in to your account, so we locked it for 15 minutes. If this was not you, change your password. If you need help, give the lock code {0}.
email.locked.action=Change password

email.identity-linked.subject=You linked a {0} account to Brackety
email.identity-linked.body=A {0} account has been linked to your Brackety account and can now be used to sign in. If this was not you, change your password and unlink it from settings.
email.identity-linked.action=Change password

email.identity-unlinked.subject=You unlinked your {0} account from Brackety
email.identity-unlinked.body=The {0} account has been unlinked from your Brackety account and can no longer be used to sign in. If this was not you, change your password now.
email.identity-unlinked.action=Change password

email.password-removed.subject=The password of your Brackety account was removed
email.password-removed.body=The password of your account has been removed and all its sessions have been closed. You can now only sign in with your linked accounts. If this was not you, recover your account now.
email.password-removed.action=Recover password

email.change-email.subject=Confirm your new email on Brackety
email.change-email.body=You asked to use this address for your Brackety account. Confirm it to finish the change. The link expires in 24 hours. If this was not you, ignore this message.
email.change-email.action=Confirm email

email.email-in-use.subject=Someone tried to use your email on Brackety
email.email-in-use.body=Someone, maybe you, tried to change the email of a Brackety account to this address, but it already has an account. Nothing has changed. If this was not you, ignore this message.
email.email-in-use.action=Recover password

email.email-changed.subject=Your Brackety email has changed
email.email-changed.body=The email of your account has been changed to {0} and all its sessions have been closed. This address no longer signs in. If this was not you, someone knows your password: if you have Google linked, sign in with it and change the email back.
email.email-changed.action=Sign in

email.deletion-scheduled.subject=Your Brackety account will be deleted
email.deletion-scheduled.body=Your account will be deleted for good on {0}, with all its data. To cancel it, sign in before that day.
email.deletion-scheduled.action=Sign in

email.pending-deletion.subject=Your Brackety account is pending deletion
email.pending-deletion.body=Someone, maybe you, tried to sign up with this email, but its account is pending deletion. To cancel the deletion and keep using it, sign in. If this was not you, ignore this message.
email.pending-deletion.action=Sign in

email.organizer-validated.subject=Your {0} profile on Brackety is validated
email.organizer-validated.body=We have validated your {0} profile. You can now publish events on Brackety.
email.organizer-validated.action=Sign in
