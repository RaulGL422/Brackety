email.footer=Brackety · This is an automatic message, please do not reply.

email.verify.subject=Confirm your email on Brackety
email.verify.body=To finish creating your Brackety account, confirm your email. The link expires in 24 hours. If this was not you, ignore this message.
email.verify.action=Confirm email

email.reminder.subject=Your Brackety account will be deleted in 2 days
email.reminder.body=You have not confirmed your email yet. If you do not, your account and all its data will be deleted in 2 days. The link expires in 24 hours.
email.reminder.action=Confirm email

email.already-registered.subject=You already have a Brackety account
email.already-registered.body=Someone, maybe you, tried to sign up with this email, but it already has an account. If you do not remember your password, you can change it. If this was not you, ignore this message.
email.already-registered.action=Recover password

email.reset.subject=Change your Brackety password
email.reset.body=You asked to change your password. The link expires in 1 hour. If this was not you, ignore this message: your password stays the same.
email.reset.action=Change password

email.password-changed.subject=Your Brackety password has changed
email.password-changed.body=The password of your account has been changed and all its sessions have been closed. If this was not you, recover your account now.
email.password-changed.action=Recover password

email.session-reused.subject=Possible unauthorised access to your Brackety account
email.session-reused.body=An old session of your account was used, which may mean someone copied it. We have closed it to be safe. We recommend changing your password.
email.session-reused.action=Change password

email.locked.subject=Your Brackety account is locked for 15 minutes
email.locked.body=There were several failed attempts to sign in to your account, so we locked it for 15 minutes. If this was not you, change your password. If you need help, give the lock code {0}.
email.locked.action=Change password
