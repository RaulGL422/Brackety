server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # A location with its own add_header drops the inherited ones, hence the include in both places.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry points must never be cached, or clients keep an old build after a deploy.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
