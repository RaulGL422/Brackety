server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # A location with its own add_header drops the inherited ones, hence the include in both places.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry points and the app itself (main.dart.*, unversioned names) are revalidated on every load, or
    # clients keep an old build after a deploy, also after the update notice reloads the page.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|main\.dart\.(js|mjs|wasm)|manifest\.json|assets/(AssetManifest|FontManifest)[^/]*)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Extra locations of one image (the admin one adds its /api/ proxy); empty for web.
    include /etc/nginx/app.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
