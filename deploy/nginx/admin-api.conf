# Admin image only. The admin app calls the API on its own host (admin.<domain>), so every call goes
# through Cloudflare Access and reaches the API with the Cf-Access-Jwt-Assertion header it checks.
location /api/ {
    # Resolved per request by Docker's DNS: nginx starts even while the api container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API takes the client IP from here for its login lockout.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
