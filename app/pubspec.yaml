name: brackety
description: Brackety app for Android and the public web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: 6.8.1
  brackety_core:
    path: ../packages/brackety_core
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.1.1
  intl: 0.20.3
  path_provider: 2.1.6
  share_plus: 13.3.1
  url_launcher: 6.3.3
  uuid: 4.6.0
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/bell.wav
